<div class="layout">

  <!-- SIDEBAR -->
  <aside [class.collapsed]="isSidebarCollapsed" class="sidebar">
    <h2 class="logo">BlackMarket</h2>

    <ul class="menu">
      <li routerLink="/dashboard">🏠 Dashboard</li>
      <li routerLink="/users">👤 Users</li>
      <li routerLink="/reports">📊 Reports</li>
      <li routerLink="/settings">⚙️ Settings</li>
    </ul>

  </aside>

  <!-- MAIN AREA -->
  <div class="main-content">

    <!-- NAVBAR -->
    <nav class="navbar">
      <div class="hamburger" (click)="toggleSidebar()">☰</div>
 <!-- empty space (left) -->

      <div class="navbar-right">
        <span class="profile">👤</span>
        <button class="logout-btn" (click)="logout()">Logout</button>
      </div>
    </nav>

    <!-- PAGE CONTENT -->
    <div class="content">
      <h1>Reports</h1>

      <!-- CARDS -->
      <div class="card-container">

        <div class="card">
          <h2>Users</h2>
          <p>120 Active Users</p>
        </div>

        <div class="card">
          <h2>Revenue</h2>
          <p>$8,450 Today</p>
        </div>

        <div class="card">
          <h2>Alerts</h2>
          <p>5 New Alerts</p>
        </div>

        <div class="card">
          <h2>Tasks</h2>
          <p>12 Pending Tasks</p>
        </div>
</div>
    </div>
  </div>
</div>
