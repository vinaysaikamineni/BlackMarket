<div style="padding: 20px;">
  <div style="display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:16px;">
    <h2 style="margin:0;">Users</h2>

    <div style="display:flex; gap:8px; align-items:center;">
      <input
        type="text"
        placeholder="Search by name, email, role..."
        [(ngModel)]="searchTerm"
        style="width:320px; padding:10px 12px; border:1px solid #d6d6d6; border-radius:8px;"
      />
      <button
        type="button"
        (click)="clearSearch()"
        [disabled]="!searchTerm"
        style="padding:10px 12px; border:1px solid #d6d6d6; border-radius:8px; background:white; cursor:pointer;"
      >
        Clear
      </button>
    </div>
  </div>

  <div style="border:1px solid #e6e6e6; border-radius:12px; padding:8px; background:#fff;">
    <table style="width:100%; border-collapse:collapse;">
      <thead>
        <tr>
          <th style="text-align:left; padding:12px 10px; border-bottom:1px solid #efefef;">Name</th>
          <th style="text-align:left; padding:12px 10px; border-bottom:1px solid #efefef;">Email</th>
          <th style="text-align:left; padding:12px 10px; border-bottom:1px solid #efefef;">Role</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let u of filteredUsers">
          <td style="padding:12px 10px; border-bottom:1px solid #efefef;">{{ u.name }}</td>
          <td style="padding:12px 10px; border-bottom:1px solid #efefef;">{{ u.email }}</td>
          <td style="padding:12px 10px; border-bottom:1px solid #efefef;">{{ u.role }}</td>
        </tr>

        <tr *ngIf="filteredUsers.length === 0">
          <td colspan="3" style="padding:18px 10px; text-align:center; color:#666;">No users found.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
